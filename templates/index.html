<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electronics Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#19365b,#050b15);color:#edf5ff;font-family:system-ui,sans-serif}.app{width:min(1100px,94vw);margin:25px auto}.header,.chat{background:#0d1b2ddd;border:1px solid #ffffff20;border-radius:22px;box-shadow:0 20px 70px #0006}.header{padding:22px;display:flex;justify-content:space-between;gap:15px}.logo{font-size:28px}.subtitle{color:#9db2c8;font-size:13px}.chat{margin-top:18px;display:flex;flex-direction:column;height:75vh;min-height:500px}.messages{padding:25px;overflow:auto;flex:1}.message{display:flex;gap:10px;margin-bottom:18px}.user{justify-content:flex-end}.avatar{width:32px;height:32px;display:grid;place-items:center}.bubble{max-width:82%;padding:13px 16px;border-radius:17px;white-space:pre-wrap;line-height:1.5;background:#ffffff0b;border:1px solid #ffffff18}.user .bubble{background:linear-gradient(135deg,#5865f2,#20b8d6)}.composer{padding:15px;border-top:1px solid #ffffff18}.quick{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.quick button,.reset,.send{padding:10px 14px;border-radius:12px;border:1px solid #ffffff22;cursor:pointer}.quick button,.reset{background:#ffffff0b;color:#dce8f5}.form{display:flex;gap:10px}textarea{flex:1;resize:none;border-radius:14px;padding:13px;background:#050b15;color:white;border:1px solid #ffffff22}.send{background:#5eead4;color:#03201c;font-weight:700}@media(max-width:700px){.app{width:96vw;margin:10px auto}.chat{height:calc(100vh - 110px)}.status{display:none}}</style></head><body><div class="app"><header class="header"><div class="logo">🐍 <b>Electronics Assistant</b><div class="subtitle">A focused assistant for electronics, providing clear educational and practical guidance.</div></div><div class="status">● Gemini Ready</div></header><main class="chat"><section class="messages" id="messages"></section><section class="composer"><div class="quick" id="quick"></div><form class="form" id="form"><textarea id="input" placeholder="Ask a domain-related question..."></textarea><button class="reset" type="button" id="reset">Reset</button><button class="send">Send</button></form></section></main></div><script>
const title="Electronics Assistant",icon="\ud83d\udc0d",suggestions=["Explain Electronics basics", "Give a practical Electronics example", "Common Electronics mistakes", "Beginner roadmap for Electronics"];const m=document.getElementById("messages"),f=document.getElementById("form"),i=document.getElementById("input");
function add(t,r="bot"){let row=document.createElement("div");row.className="message "+(r==="user"?"user":"");row.innerHTML='<div class="avatar">'+(r==="user"?"You":icon)+'</div><div class="bubble"></div>';row.querySelector(".bubble").textContent=t;m.append(row);m.scrollTop=m.scrollHeight}
suggestions.forEach(s=>{let b=document.createElement("button");b.textContent=s;b.onclick=()=>{i.value=s;f.requestSubmit()};document.getElementById("quick").append(b)});
add("Hello! I’m "+title+". Ask me a question within my supported domain.");
f.onsubmit=async e=>{e.preventDefault();let t=i.value.trim();if(!t)return;add(t,"user");i.value="";add("Thinking...");let wait=m.lastChild;try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t})}),d=await r.json();wait.remove();if(!r.ok)throw Error(d.error||"Request failed");add(d.reply)}catch(x){wait.remove();add("Sorry: "+x.message)}};
document.getElementById("reset").onclick=async()=>{await fetch("/api/reset",{method:"POST"});m.innerHTML="";add("Chat reset.")};
</script></body></html>
